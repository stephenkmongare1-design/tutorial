{% extends "auth/_auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h4 class="fw-bold text-center mb-1">Welcome back</h4>
<p class="text-muted text-center mb-4">Log in to your TutorAI account</p>
<form method="POST">
  <div class="mb-3">
    <label class="form-label fw-semibold">Email</label>
    <input type="email" class="form-control" name="email" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label fw-semibold">Password</label>
    <input type="password" class="form-control" name="password" required>
  </div>
  <button class="btn btn-brand w-100 py-2" type="submit">Log in</button>
</form>
<p class="text-center text-muted mt-3 mb-0 small">
  New here? <a href="{{ url_for('auth.register_choice') }}">Create an account</a>
</p>
<p class="text-center mt-2"><a href="{{ url_for('auth.landing') }}" class="small text-muted"><i class="bi bi-arrow-left"></i> Back home</a></p>
{% endblock %}
